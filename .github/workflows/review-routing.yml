name: Review routing

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'locales/**'
      - 'tools/**'
      - 'itest/**'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency: review-routing-${{ github.event.pull_request.number }}

jobs:
  route:
    name: Route
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Route pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ROUTING_PATTERNS: ${{ vars.ROUTING_PATTERNS }}
        with:
          script: |
            try {
              const label = 'needs-maintainer-review';
              const note = 'Thanks. A maintainer will review this before merge.';
              const { owner, repo } = context.repo;
              const n = context.payload.pull_request.number;
              const pr = (await github.rest.pulls.get({ owner, repo, pull_number: n })).data;
              const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: n });
              const isCode = f =>
                f.endsWith('.go') ||
                f === 'go.mod' ||
                f === 'go.sum' ||
                f.startsWith('locales/') ||
                f.startsWith('tools/') ||
                f.startsWith('itest/');
              if (!files.some(f => isCode(f.filename))) return;
              const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: n });
              const body = pr.body || '';
              let patterns = [];
              try {
                const raw = process.env.ROUTING_PATTERNS || '';
                if (raw) patterns = JSON.parse(raw);
              } catch (err) { patterns = []; }
              const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const matchers = patterns
                .filter(p => typeof p === 'string' && p.length > 0)
                .map(p => new RegExp('\\b' + esc(p) + '\\b', 'i'));
              const hit = t => matchers.some(re => re.test(t || ''));
              const genLine = /generated with/i;
              const isBot = u => u && (u.type === 'Bot' || (u.login || '').endsWith('[bot]')) && u.login !== 'dependabot[bot]';
              const configNames = ['CLAUDE.md', 'AGENTS.md', '.cursorrules', '.github/copilot-instructions.md'];
              let route = false;
              const assoc = pr.author_association || '';
              if (assoc === 'FIRST_TIME_CONTRIBUTOR' || assoc === 'FIRST_TIMER') route = true;
              if (!route && isBot(pr.user)) route = true;
              if (!route && !/^- \[[xX]\] This is my own work\./m.test(body)) route = true;
              if (!route && (genLine.test(body) || hit(body))) route = true;
              if (!route && files.some(f => f.status === 'added' && configNames.includes(f.filename))) route = true;
              if (!route) {
                for (const c of commits) {
                  const msg = (c.commit && c.commit.message) || '';
                  const trailers = msg.match(/^(Co-authored-by|Generated-by|Assisted-by):.*$/gim) || [];
                  if (trailers.some(line => hit(line))) { route = true; break; }
                  if (genLine.test(msg)) { route = true; break; }
                  if (isBot(c.author) || isBot(c.committer)) { route = true; break; }
                }
              }
              if (!route) return;
              const names = (pr.labels || []).map(l => l.name);
              if (names.includes(label)) return;
              await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: [label] });
              await github.rest.issues.createComment({ owner, repo, issue_number: n, body: note });
            } catch (err) {
              return;
            }
