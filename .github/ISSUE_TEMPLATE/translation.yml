name: Translation
description: Add or update a language catalog.
labels: ["translation"]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: e.g. Kiswahili
    validations:
      required: true
  - type: input
    id: tag
    attributes:
      label: BCP 47 tag
      placeholder: e.g. sw
    validations:
      required: true
  - type: dropdown
    id: speak
    attributes:
      label: I speak this language
      options:
        - yes
        - no
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: New or update
      options:
        - new
        - update
    validations:
      required: true
