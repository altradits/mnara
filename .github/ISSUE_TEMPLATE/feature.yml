name: Feature request
description: Ask for new behaviour or an improvement.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing today?
    validations:
      required: true
  - type: textarea
    id: who
    attributes:
      label: Who it helps
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
    validations:
      required: false
